data:
  dataset_path: "datasets/ENB2012_data.xlsx"
  type: regression # Options: regression, classification
  # If columns are not valid Python identifiers, the program coonverts them,
  # and here you need to specify valid column
  # names (e.g. "Concrete compressive strength(MPa, megapascals)" -> "Concrete_compressive_strength_MPa_megapascals").
  target_columns:
    - Y1
    - Y2
  missing_value_strategy: 'drop'  # Options: 'mean', 'median', 'mode', 'drop'
  test_size: 0.2
  random_state: 42

selected_model: NeuralNetwork # Options: 'NeuralNetwork', 'GeneticProgramming'
loss_function: # Options: regression: 'mae', 'mse', 'r2', classification: 'accuracy', 'log_loss'
  - r2
  - mae

model_training:
  nn:
    # Neural Network Model
    hidden_units: 128
    hidden_layers: 3
    activation_function: relu
    batch_normalization: True
    learning_rate: 0.001
    optimizer: adam   # Options: 'adam', 'sgd'
    epochs: 600
    batch_size: 16
    dropout_rate: 0.1
    print_train_logs: 1 # 0 - not printing, 1 - printing
  gp:
    # Genetic Programming Model
    population_size: 15
    generations: 200
    crossover_pb: 0.5
    mutation_pb: 0.2
    elitism: False

logging:
  # format: '%(name)s - %(levelname)s - %(message)s'
  format: '%(message)s'
  level: "INFO"
  file: "logs/training.log"
